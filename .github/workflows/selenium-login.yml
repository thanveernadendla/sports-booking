name: selenium-login.yml

on:
  push:
  workflow_dispatch:

jobs:
  selenium-web-api:
    name: Selenium E2E Web + API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Selenium dependencies
        working-directory: test-cases/web-tests
        run: npm ci

      - name: Validate backend
        run: node --check backend/server.js

      - name: Start SportZone server
        env:
          PORT: 5000
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for SportZone server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api/config > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Generate 300+ Test Case Excel Catalog
        working-directory: test-cases/web-tests
        run: npm run test:catalog

      - name: Run Selenium E2E and 500+ web checks
        working-directory: test-cases/web-tests
        env:
          SPORTZONE_BASE_URL: http://localhost:5000
          WEB_CASE_TARGET: 520
        run: npm run test:ci

      - name: Upload Selenium Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: |
            test-cases/web-tests/reports/**/*.xlsx
            test-cases/web-tests/reports/screenshots/**
            server.log

  appium-mobile-tests:
    name: Appium Mobile Tests Driver
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Appium dependencies
        working-directory: test-cases/mobile-tests
        run: npm ci

      - name: Run Appium Android 500+ checks
        working-directory: test-cases/mobile-tests
        env:
          ANDROID_CASE_TARGET: 520
        run: npm test

      - name: Upload Appium Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-report
          path: |
            test-cases/mobile-tests/reports/**/*.xlsx
            test-cases/mobile-tests/reports/screenshots/**

  baseline-load-test:
    name: Baseline Load Test 100 Users
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install load test dependencies
        working-directory: test-cases/load-tests
        run: npm ci

      - name: Start SportZone server
        env:
          PORT: 5000
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for SportZone server
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api/config > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run 100-user 1-minute load test
        working-directory: test-cases/load-tests
        env:
          SPORTZONE_BASE_URL: http://localhost:5000
          LOAD_VUS: 100
          LOAD_DURATION_SECONDS: 60
          LOAD_MIN_REQUESTS: 500
          LOAD_MAX_AVG_LATENCY_MS: 3000
          LOAD_MAX_P95_LATENCY_MS: 10000
          LOAD_MAX_ERRORS: 500
        run: npm test

      - name: Upload load test Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-report
          path: |
            test-cases/load-tests/reports/**/*.xlsx
            server.log

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: selenium-web-api
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  generate-tests-report:
    name: Generate SportZone Test Report
    runs-on: ubuntu-latest
    needs:
      - selenium-web-api
      - appium-mobile-tests
      - baseline-load-test
    if: always()
    timeout-minutes: 5

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: sportzone-test-reports

      - name: Build report index
        run: |
          echo "# SportZone Test Reports" > sportzone-test-reports/README.md
          echo "" >> sportzone-test-reports/README.md
          echo "- Selenium Web + API: 500+ checks" >> sportzone-test-reports/README.md
          echo "- Appium Android: 500+ checks" >> sportzone-test-reports/README.md
          echo "- Load Test: 100 virtual users for 1 minute" >> sportzone-test-reports/README.md

      - name: Upload combined Excel analysis
        uses: actions/upload-artifact@v4
        with:
          name: sportzone-complete-test-analysis
          path: sportzone-test-reports/**
