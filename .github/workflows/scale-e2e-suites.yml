name: Scale E2E suites to 1800 test cases

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  selenium-website-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Start SportZone server
        env:
          PORT: 5000
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/sportzone' }}
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api/config > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Selenium Website Tests (300)
        run: node test-cases/web-tests/tests/run_website_300.js

      - name: Upload Selenium Web Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: |
            test-cases/web-tests/reports/selenium_website_tests_300.xlsx
            test-cases/web-tests/reports/selenium-web-report.xlsx

  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Run Appium Android Tests (300)
        run: node test-cases/mobile-tests/tests/run_android_300.js

      - name: Upload Appium Android Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: |
            test-cases/mobile-tests/reports/appium_android_tests_300.xlsx
            test-cases/mobile-tests/reports/appium-android-report.xlsx

  unit-tests-api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Run Unit Tests — API (300)
        run: node test-cases/unit-tests/run_unit_300.js

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            test-cases/unit-tests/reports/unit_tests_api_300.xlsx
            test-cases/unit-tests/reports/unit-test-report.xlsx

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Run Validation Tests (300)
        run: node test-cases/validation-tests/run_validation_300.js

      - name: Upload Validation Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            test-cases/validation-tests/reports/validation_tests_300.xlsx
            test-cases/validation-tests/reports/validation-test-report.xlsx

  deployment-status-tests:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Run Deployment Status Tests (300)
        run: node test-cases/deployment-tests/run_deployment_300.js

      - name: Upload Deployment Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: |
            test-cases/deployment-tests/reports/deployment_status_tests_300.xlsx
            test-cases/deployment-tests/reports/deployment-test-report.xlsx

  load-testing-performance:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Run Load Testing — Performance (300)
        run: node test-cases/load-tests/run_load_300.js

      - name: Upload Load Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            test-cases/load-tests/reports/load_testing_performance_300.xlsx
            test-cases/load-tests/reports/load-test-report.xlsx

  compile-master-report:
    name: Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs:
      - selenium-website-tests
      - appium-android-tests
      - unit-tests-api
      - validation-tests
      - deployment-status-tests
      - load-testing-performance
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix test-cases/web-tests ci

      - name: Compile Master 1800 Test Cases Report
        run: node test-cases/run_all_suites_1800.js

      - name: Upload Full Master E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: |
            test-cases/reports/full_master_e2e_report_1800.xlsx
            test-cases/reports/full-e2e-report.xlsx

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
